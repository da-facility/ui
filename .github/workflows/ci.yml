name: CI

# Typechecks, builds and tests on Blacksmith when code changes. Native macOS
# bounce can't run on Linux, so CI runs the headless suite; run the full
# `bun run test` on a Mac for scrolling changes (see AGENTS.md).
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE*', 'artifacts/**']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE*', 'artifacts/**']

# A newer push makes an older run on the same branch pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium webkit
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium webkit
      - run: bun run test:headless
      - run: bun run test:package
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
