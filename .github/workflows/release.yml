name: Release

# Push a tag matching the package version (for example v1.2.0) to check it,
# publish @da-facility/ui to npm and create the GitHub release. npm trusted
# publishing authenticates the publish job with OIDC, so no npm token is
# stored. See "Releasing" in AGENTS.md.
on:
  push:
    tags: ['v*']

jobs:
  check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Check the tag matches package.json
        run: test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bunx playwright install --with-deps chromium webkit
      - run: bun run test:headless
      - run: bun run test:package

  # npm only accepts provenance from GitHub-hosted runners, so the publish
  # runs on one rather than on Blacksmith. It only installs, builds and
  # publishes, which takes about a minute.
  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Publish to npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@da-facility/ui@$version" version >/dev/null 2>&1; then
            echo "@da-facility/ui@$version is already on npm; skipping the publish."
          else
            npm install --global npm@latest
            npm publish --access public --provenance
          fi

  release:
    needs: publish
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The release notes are this version's section of CHANGELOG.md.
          awk -v heading="## $version" '$0 == heading {found = 1; next} found && /^## / {exit} found' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
