name: Release

# Push a tag matching the package version (for example v1.2.0) to check it,
# publish @da-facility/ui to npm and create the GitHub release. npm trusted
# publishing authenticates this workflow with OIDC, so no npm token is stored.
# See "Releasing" in AGENTS.md.
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bunx playwright install --with-deps chromium webkit
      - run: bun run test:headless
      - run: bun run test:package
      - name: Publish to npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@da-facility/ui@$version" version >/dev/null 2>&1; then
            echo "@da-facility/ui@$version is already on npm; skipping the publish."
          else
            npm install --global npm@latest
            npm publish --access public --provenance
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The release notes are this version's section of CHANGELOG.md.
          awk -v heading="## $version" '$0 == heading {found = 1; next} found && /^## / {exit} found' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
